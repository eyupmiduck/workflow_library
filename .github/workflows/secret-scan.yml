name: Secret Scan

# Reusable secret scanner built on gitleaks. Scans the full git history (or
# the working tree) for accidental commits of credentials, tokens, and keys.
on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks release to download and run.
        type: string
        default: "8.30.1"
      scan-history:
        description: Scan the full git history; when false only the working tree is scanned.
        type: boolean
        default: true
      config-path:
        description: Optional path to a gitleaks config file, relative to the repo root.
        type: string
        default: ""
      fail-on-findings:
        description: Fail the job when secrets are found; set false for an advisory scan.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so secrets from earlier commits are not missed.
          fetch-depth: 0

      - name: Install gitleaks ${{ inputs.gitleaks-version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks-version }}/gitleaks_${{ inputs.gitleaks-version }}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Scan for secrets
        # Advisory mode: report findings without failing the job.
        continue-on-error: ${{ !inputs.fail-on-findings }}
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          SCAN_HISTORY: ${{ inputs.scan-history }}
        run: |
          set -euo pipefail

          args=(--redact --verbose)
          if [[ -n "${CONFIG_PATH}" ]]; then
            args+=(--config-path "${CONFIG_PATH}")
          fi

          if [[ "${SCAN_HISTORY}" == "true" ]]; then
            gitleaks git "${args[@]}"
          else
            gitleaks dir "${args[@]}" .
          fi
