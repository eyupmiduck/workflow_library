name: Maven Build

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version to build with.
        type: string
        default: "25"
      postgres-versions:
        description: JSON array of PostgreSQL image tags to build and test against.
        type: string
        default: '["postgres:16-alpine","postgres:17-alpine","postgres:18-alpine"]'
      project:
        description: Project name (repository basename, e.g. dml_utils); used for the image tag and roles.
        type: string
        required: true
      maven-command:
        description: Maven command to run; the postgres.image property is appended to it.
        type: string
        default: ./mvnw --batch-mode clean verify

jobs:
  build:
    name: Maven Build (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(inputs.postgres-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The shared build/dev shims (including postgres/ and
          # build-postgres-image.sh) live in the workflow_library submodule
          # mounted at scripts/.
          submodules: true

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          # Writes a ~/.m2/settings.xml server entry (id `github`) so Maven can
          # authenticate to GitHub Packages. `server-username`/`server-password`
          # are environment variable NAMES (not values); Maven resolves them at
          # runtime, so GITHUB_TOKEN must be exported to the Maven step below.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Python and SQLFluff
        run: pip install sqlfluff

      - name: Build custom PostgreSQL image
        env:
          PROJECT: ${{ inputs.project }}
        run: scripts/build-postgres-image.sh ${{ matrix.postgres }}

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prefix="$(printf '%s' '${{ inputs.project }}' | tr '_' '-')-"
          ${{ inputs.maven-command }} -Dpostgres.image="${prefix}${{ matrix.postgres }}"
