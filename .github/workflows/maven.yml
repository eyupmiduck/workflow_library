name: Maven Build

on:
  workflow_call:

jobs:
  build:
    name: Maven Build (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - postgres:16-alpine
          - postgres:17-alpine
          - postgres:18-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Python and SQLFluff
        run: pip install sqlfluff

      - name: Build custom PostgreSQL image
        run: scripts/build-postgres-image.sh ${{ matrix.postgres }}

      - name: Build and test
        run: ./mvnw --batch-mode clean verify -Dpostgres.image=ddl-utils-${{ matrix.postgres }}
